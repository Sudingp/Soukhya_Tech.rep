<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soukhya Tech ‚Äî Secure HR Attendance</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Login Screen -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <h2>HR Enterprise Login</h2>
      <input type="text" id="login-user" placeholder="Username" autocomplete="username">
      <input type="password" id="login-pass" placeholder="Password" autocomplete="current-password">
      <button onclick="doLogin()">Sign In</button>
      <p id="login-error" class="error-text"></p>
    </div>
  </div>

  <!-- Main App (hidden until auth) -->
  <div id="app-shell" style="display:none;">
    <header>
      <h1>Soukhya Tech Face Attendance</h1>
      <nav>
        <button onclick="showView('dashboard')">Dashboard</button>
        <button onclick="showView('employees')">Employees</button>
        <button onclick="showView('attendance')">Attendance</button>
        <button onclick="doLogOff()">Log Out</button>
      </nav>
    </header>
    <main id="main-content"></main>
  </div>

  <script src="app.js"></script>
</body>
</html>
