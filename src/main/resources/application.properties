# ── Server ──
server.port=3000

# ── MySQL Datasource ──
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:soukhya_attendance}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${MYSQL_USER:soukhya_user}
spring.datasource.password=${MYSQL_PASSWORD:soukhya_secure_pass_2026}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=5000

# ── JPA / Hibernate ──
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20

# ── JWT Secrets (dev fallbacks — override in prod) ──
app.jwt.access-secret=${JWT_ACCESS_SECRET:change-this-in-production-do-not-use-default}
app.jwt.refresh-secret=${JWT_REFRESH_SECRET:change-this-in-production-do-not-use-default}
app.jwt.access-expiry=900000
app.jwt.refresh-expiry=604800000

# ── PII Encryption (AES-256-GCM) ──
app.encryption.pii-key=${PII_ENCRYPTION_KEY:change-this-in-production-do-not-use-default}

# ── CORS Whitelist ──
app.cors.allowed-origins=${CORS_WHITELIST:http://localhost:3000,http://localhost:5173}

# ── Rate Limiting (requests per window) ──
app.ratelimit.window-ms=60000
app.ratelimit.max-requests=100
app.ratelimit.auth-max=10

# ── Cache (Caffeine) ──
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=300s

# ── Actuator ──
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ── Logging ──
logging.level.org.springframework.security=INFO
logging.level.com.soukhyatech=DEBUG