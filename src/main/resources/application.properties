# ── Server ──
server.port=3000

# ── SQLite Datasource ──
spring.datasource.url=jdbc:sqlite:database/attendance.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=5000

# ── JPA / Hibernate ──
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.id.new_generator_mappings=true

# ── JWT Secrets (dev fallbacks — override in prod) ──
app.jwt.access-secret=${JWT_ACCESS_SECRET:change-this-in-production-do-not-use-default}
app.jwt.refresh-secret=${JWT_REFRESH_SECRET:change-this-in-production-do-not-use-default}
app.jwt.access-expiry=900000
app.jwt.refresh-expiry=604800000

# ── PII Encryption (AES-256-GCM) ──
app.encryption.pii-key=${PII_ENCRYPTION_KEY:change-this-in-production-do-not-use-default}

# ── CORS Whitelist ──
app.cors.allowed-origins=${CORS_WHITELIST:http://localhost:3000,http://localhost:5173}

# ── Rate Limiting (requests per window) ──
app.ratelimit.window-ms=60000
app.ratelimit.max-requests=100
app.ratelimit.auth-max=10

# ── Cache (Caffeine) ──
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=300s

# ── Actuator ──
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ── Logging ──
logging.level.org.springframework.security=INFO
logging.level.com.soukhyatech=DEBUG