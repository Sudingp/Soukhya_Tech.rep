version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: soukhya-mysql-lts
    restart: unless-stopped
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=256M
      - --innodb-log-file-size=64M
      - --max-connections=200
    environment:
      MYSQL_ROOT_PASSWORD: soukhya_root_password_2026
      MYSQL_DATABASE: soukhya_attendance
      MYSQL_USER: soukhya_user
      MYSQL_PASSWORD: soukhya_secure_pass_2026
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema_mysql.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psoukhya_root_password_2026"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  mysql_data:
    driver: local
